<style id="gate-style">
:root{--bg:#FFF6FA;--card:#fff;--ink:#24121D;--muted:#735F6C;--line:#F1D3E1;--pink:#E0156C;--gold:#F2AE10;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#170E14;--card:#21151D;--ink:#F9EBF2;--muted:#C4A8B8;--line:#43293A;--pink:#FF4D94;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;padding:24px 16px}
.box{width:min(100%,440px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;box-shadow:0 20px 50px rgba(120,20,60,.14);text-align:center;animation:in .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.96)}}
.mark{font-family:"Permanent Marker",system-ui,sans-serif;font-size:56px;line-height:1;position:relative;display:inline-block}
.mark svg{position:absolute;width:30px;left:40%;top:-24px;color:var(--pink);transform:rotate(-8deg)}
.tag{display:inline-block;margin-top:12px;background:var(--pink);color:#fff;font-family:"Caveat Brush",cursive;font-size:24px;padding:2px 14px 4px;border-radius:6px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.by{margin:18px 0 0;color:var(--muted);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.by b{color:var(--ink)}
form{margin-top:24px;display:grid;gap:10px;text-align:left}
label{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:15px}
input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;letter-spacing:.06em}
input[type=password]:focus{outline:none;border-color:var(--pink)}
.rem{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--muted)}
button{border:0;border-radius:12px;padding:14px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:16px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 3px 0 #8f0d45}
button:disabled{opacity:.7;cursor:wait}
.err{min-height:1.4em;color:#B3261E;font-weight:700;font-size:16px;text-align:center}
.err:not(:empty){background:#FDE3E1;border:2px solid #D23E3A;border-radius:12px;padding:10px 12px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.small{margin-top:18px;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="mark">PopCorn<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 3.5L12 4l4.5 7.5L21 8l-2 10H5z"/></svg></div><br>

  <p class="by">Scénario 2 · Première MCVA<br>Un scénario conçu par <b>Mme Marie Frison</b></p>
  <form id="f">
    <label for="p">Mot de passe de la classe</label>
    <input type="password" id="p" autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus>
    <label class="rem"><input type="checkbox" id="sh"> Afficher le mot de passe</label>
    <label class="rem"><input type="checkbox" id="r" checked> Se souvenir sur cet ordinateur</label>
    <button type="submit" id="b">Entrer dans le scénario</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <p class="small">Accès réservé aux élèves de la classe. Demande le mot de passe à ton professeur.</p>
</main>

var K='popcorn-cle';
function b64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
function hex(u){ return Array.from(u,function(x){return x.toString(16).padStart(2,'0');}).join(''); }
function unhex(h){ return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16);})); }
var er=document.getElementById('e'), btn=document.getElementById('b');
document.getElementById('sh').addEventListener('change',function(){ document.getElementById('p').type=this.checked?'text':'password'; });
function show(msg){ er.textContent=msg; btn.disabled=false; btn.textContent='Entrer dans le scénario'; }
async function derive(pwd){ var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,256)); }
async function decrypt(raw){ var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d))); }
function mount(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var gs=document.getElementById('gate-style'); if(gs) gs.remove();
  document.title=doc.title||document.title;
  document.body.innerHTML=''; document.body.removeAttribute('style');
  function copy(src,dest){ Array.prototype.slice.call(src.childNodes).forEach(function(n){
    if(n.nodeName==='SCRIPT'){ var sc=document.createElement('script'); Array.prototype.forEach.call(n.attributes,function(a){ sc.setAttribute(a.name,a.value); }); sc.textContent=n.textContent; dest.appendChild(sc); }
    else if(n.nodeName!=='TITLE'){ dest.appendChild(document.importNode(n,true)); } }); }
  copy(doc.head,document.head); copy(doc.body,document.body);
  window.scrollTo(0,0);
}
async function unlock(raw,remember){
  var html; try{ html=await decrypt(raw); }catch(e){ return false; }
  try{ sessionStorage.setItem(K,hex(raw)); if(remember) localStorage.setItem(K,hex(raw)); }catch(e){}
  mount(html); return true;
}
if(!window.crypto||!crypto.subtle){ show('Ce navigateur ne peut pas ouvrir le scénario. Utilise Chrome, Edge, Firefox ou Safari à jour.'); return; }
(async function(){ var saved=null; try{ saved=sessionStorage.getItem(K)||localStorage.getItem(K); }catch(e){}
  if(saved){ try{ if(!(await unlock(unhex(saved),false))){ try{ localStorage.removeItem(K); sessionStorage.removeItem(K); }catch(_){} } }catch(e){ show('Le scénario n’a pas pu s’ouvrir ('+(e&&e.message||e)+').'); } } })();
document.getElementById('f').addEventListener('submit',async function(ev){ ev.preventDefault(); er.textContent=''; btn.disabled=true; btn.textContent='Ouverture…';
  var slow=setTimeout(function(){ er.textContent='Ouverture en cours, patiente quelques secondes…'; },4000);
  try{ var raw=await derive(document.getElementById('p').value.split(' ').join('').trim().toUpperCase()); var ok=await unlock(raw,document.getElementById('r').checked); clearTimeout(slow);
    if(!ok){ show('Mot de passe incorrect. Vérifie ce que tu as tapé (coche « Afficher le mot de passe »).'); var box=document.getElementById('box'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
  }catch(e){ clearTimeout(slow); show('Le scénario n’a pas pu s’ouvrir ('+(e&&e.message||e)+'). Essaie avec Chrome ou Edge.'); }
});
})();
